<div id="cookie-banner" class="hidden fixed bottom-0 inset-x-0 z-50 bg-white border-t border-gray-200 shadow-lg p-4 md:p-6">
  <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
    <p class="text-gray-700 text-sm">
      We use cookies to improve your experience on our site. By continuing to browse, you agree to our
      <a href="{% url 'pages:cookie_policy' %}" class="text-indigo-600 underline hover:text-indigo-800">Cookie Policy</a>.
    </p>
    <div class="flex gap-3 shrink-0">
      <button id="cookie-accept" class="px-5 py-3 bg-indigo-600 text-white text-sm font-semibold rounded-lg hover:bg-indigo-700 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400 focus-visible:ring-offset-2">
        Accept
      </button>
      <button id="cookie-dismiss" class="px-5 py-3 bg-gray-200 text-gray-700 text-sm font-semibold rounded-lg hover:bg-gray-300 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400 focus-visible:ring-offset-2">
        Dismiss
      </button>
    </div>
  </div>
</div>
