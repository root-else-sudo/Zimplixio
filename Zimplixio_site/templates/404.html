{% extends "base.html" %}

{% block title %}Page Not Found — {{ site_name }}{% endblock %}

{% block content %}
<section class="hero-animated-bg relative py-32 overflow-hidden">
  <div id="hero-particles" aria-hidden="true"></div>
  <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 text-center relative z-10">
    <p class="text-8xl md:text-9xl font-bold text-white/20 leading-none mb-4" aria-hidden="true">404</p>
    <h1 class="text-3xl md:text-4xl font-bold text-white mb-4">Page not found</h1>
    <p class="text-indigo-100 text-lg mb-10 max-w-md mx-auto">
      The page you're looking for doesn't exist or has been moved.
    </p>
    <div class="flex flex-wrap gap-4 justify-center">
      <a href="{% url 'pages:home' %}"
         class="inline-flex items-center px-6 py-3 bg-white text-indigo-700 font-semibold rounded-lg hover:bg-indigo-50 transition-colors shadow-lg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-indigo-800">
        <svg class="w-4 h-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true" focusable="false"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Go home
      </a>
      <a href="{% url 'booking:book' %}"
         class="inline-flex items-center px-6 py-3 border-2 border-white/60 text-white font-semibold rounded-lg hover:bg-white/10 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-indigo-800">
        Book a discovery call
      </a>
    </div>
  </div>
</section>
{% endblock %}
