<meta name="description" content="{% block meta_description %}Zimplixio delivers enterprise-grade technology solutions tailored for growing businesses. Strategy, architecture, and implementation from senior consultants.{% endblock %}">
<meta name="robots" content="index, follow">
<link rel="canonical" href="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">

<!-- Open Graph -->
<meta property="og:title" content="{% block og_title %}{{ site_name }} — {{ site_tagline }}{% endblock %}">
<meta property="og:description" content="{% block og_description %}Enterprise-grade technology solutions for growing businesses.{% endblock %}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">
<meta property="og:site_name" content="{{ site_name }}">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% block twitter_title %}{{ site_name }} — {{ site_tagline }}{% endblock %}">
<meta name="twitter:description" content="{% block twitter_description %}Enterprise-grade technology solutions for growing businesses.{% endblock %}">
