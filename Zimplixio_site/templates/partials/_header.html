{% load static %}
<header class="sticky top-0 z-50 bg-white/95 backdrop-blur-sm border-b border-gray-200" x-data="{ mobileOpen: false }">
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <!-- Logo -->
      <a href="{% url 'pages:home' %}" class="flex items-center">
        <img src="{% static 'images/logo.svg' %}" alt="Zimplixio" class="h-14 w-auto">
      </a>

      <!-- Desktop nav -->
      <div class="hidden md:flex items-center space-x-8">
        <a href="{% url 'pages:home' %}" class="text-gray-700 hover:text-indigo-600 font-medium transition-colors">Home</a>
        <a href="{% url 'pages:about' %}" class="text-gray-700 hover:text-indigo-600 font-medium transition-colors">About</a>
        <a href="{% url 'services:services' %}" class="text-gray-700 hover:text-indigo-600 font-medium transition-colors">Services</a>
        <a href="{% url 'showcase:gallery' %}" class="text-gray-700 hover:text-indigo-600 font-medium transition-colors">Showcase</a>
        <a href="{% url 'metrics:results' %}" class="text-gray-700 hover:text-indigo-600 font-medium transition-colors">Results</a>
        <a href="{% url 'pages:contact' %}" class="text-gray-700 hover:text-indigo-600 font-medium transition-colors">Contact</a>
        <a href="{% url 'booking:book' %}" class="inline-flex items-center px-4 py-2 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 transition-colors">
          Book a Call
        </a>
      </div>

      <!-- Mobile hamburger -->
      <button id="mobile-menu-btn" class="md:hidden p-2 rounded-md text-gray-600 hover:text-indigo-600 hover:bg-gray-100" aria-label="Toggle menu">
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path id="hamburger-icon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          <path id="close-icon" class="hidden" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Mobile menu -->
    <div id="mobile-menu" class="hidden md:hidden pb-4 border-t border-gray-100">
      <div class="flex flex-col space-y-2 pt-4">
        <a href="{% url 'pages:home' %}" class="px-3 py-2 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 rounded-md font-medium">Home</a>
        <a href="{% url 'pages:about' %}" class="px-3 py-2 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 rounded-md font-medium">About</a>
        <a href="{% url 'services:services' %}" class="px-3 py-2 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 rounded-md font-medium">Services</a>
        <a href="{% url 'showcase:gallery' %}" class="px-3 py-2 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 rounded-md font-medium">Showcase</a>
        <a href="{% url 'metrics:results' %}" class="px-3 py-2 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 rounded-md font-medium">Results</a>
        <a href="{% url 'pages:contact' %}" class="px-3 py-2 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 rounded-md font-medium">Contact</a>
        <a href="{% url 'booking:book' %}" class="mx-3 mt-2 text-center px-4 py-2 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700">Book a Call</a>
      </div>
    </div>
  </nav>
</header>
