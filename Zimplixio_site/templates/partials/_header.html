{% load static %}
<header class="sticky top-0 z-50 bg-white/95 backdrop-blur-sm border-b border-gray-200 dark:bg-gray-900/95 dark:border-gray-700">
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <!-- Logo -->
      <a href="{% url 'pages:home' %}" class="logo-magnetic flex items-center">
        <img src="{% static 'images/logo.svg' %}" alt="Zimplixio" class="h-14 w-auto">
      </a>

      <!-- Desktop nav -->
      <div class="hidden md:flex items-center space-x-8">
        <a href="{% url 'pages:home' %}" class="text-gray-700 hover:text-indigo-600 font-medium transition-colors dark:text-gray-300 dark:hover:text-indigo-400">Home</a>
        <a href="{% url 'pages:about' %}" class="text-gray-700 hover:text-indigo-600 font-medium transition-colors dark:text-gray-300 dark:hover:text-indigo-400">About</a>
        <a href="{% url 'services:services' %}" class="text-gray-700 hover:text-indigo-600 font-medium transition-colors dark:text-gray-300 dark:hover:text-indigo-400">Services</a>
        <a href="{% url 'showcase:gallery' %}" class="text-gray-700 hover:text-indigo-600 font-medium transition-colors dark:text-gray-300 dark:hover:text-indigo-400">Showcase</a>
        <a href="{% url 'metrics:results' %}" class="text-gray-700 hover:text-indigo-600 font-medium transition-colors dark:text-gray-300 dark:hover:text-indigo-400">Results</a>
        <a href="{% url 'pages:contact' %}" class="text-gray-700 hover:text-indigo-600 font-medium transition-colors dark:text-gray-300 dark:hover:text-indigo-400">Contact</a>

        <!-- Dark mode toggle (desktop) -->
        <button class="dark-mode-toggle p-2 rounded-lg text-gray-600 hover:text-indigo-600 hover:bg-gray-100 dark:text-gray-400 dark:hover:text-indigo-400 dark:hover:bg-gray-800 transition-colors" aria-label="Toggle dark mode">
          <!-- Moon icon (shown in light mode) -->
          <svg class="dark-mode-moon h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
          </svg>
          <!-- Sun icon (shown in dark mode) -->
          <svg class="dark-mode-sun hidden h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
        </button>

        <a href="{% url 'booking:book' %}" class="logo-magnetic btn-premium inline-flex items-center px-4 py-2 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 transition-colors">
          Book a Call
        </a>
      </div>

      <!-- Mobile right side: dark toggle + hamburger -->
      <div class="md:hidden flex items-center gap-1">
        <!-- Dark mode toggle (mobile) -->
        <button class="dark-mode-toggle p-2 rounded-md text-gray-600 hover:text-indigo-600 hover:bg-gray-100 dark:text-gray-400 dark:hover:text-indigo-400 dark:hover:bg-gray-800 transition-colors" aria-label="Toggle dark mode">
          <svg class="dark-mode-moon h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
          </svg>
          <svg class="dark-mode-sun hidden h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
        </button>

        <!-- Mobile hamburger -->
        <button id="mobile-menu-btn" class="p-2 rounded-md text-gray-600 hover:text-indigo-600 hover:bg-gray-100 dark:text-gray-400 dark:hover:text-indigo-400 dark:hover:bg-gray-800" aria-label="Toggle menu">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path id="hamburger-icon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            <path id="close-icon" class="hidden" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile menu -->
    <div id="mobile-menu" class="hidden md:hidden pb-4 border-t border-gray-100 dark:border-gray-700">
      <div class="flex flex-col space-y-2 pt-4">
        <a href="{% url 'pages:home' %}" class="px-3 py-2 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 rounded-md font-medium dark:text-gray-300 dark:hover:bg-indigo-900/30 dark:hover:text-indigo-400">Home</a>
        <a href="{% url 'pages:about' %}" class="px-3 py-2 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 rounded-md font-medium dark:text-gray-300 dark:hover:bg-indigo-900/30 dark:hover:text-indigo-400">About</a>
        <a href="{% url 'services:services' %}" class="px-3 py-2 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 rounded-md font-medium dark:text-gray-300 dark:hover:bg-indigo-900/30 dark:hover:text-indigo-400">Services</a>
        <a href="{% url 'showcase:gallery' %}" class="px-3 py-2 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 rounded-md font-medium dark:text-gray-300 dark:hover:bg-indigo-900/30 dark:hover:text-indigo-400">Showcase</a>
        <a href="{% url 'metrics:results' %}" class="px-3 py-2 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 rounded-md font-medium dark:text-gray-300 dark:hover:bg-indigo-900/30 dark:hover:text-indigo-400">Results</a>
        <a href="{% url 'pages:contact' %}" class="px-3 py-2 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 rounded-md font-medium dark:text-gray-300 dark:hover:bg-indigo-900/30 dark:hover:text-indigo-400">Contact</a>
        <a href="{% url 'booking:book' %}" class="btn-premium mx-3 mt-2 text-center px-4 py-2 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700">Book a Call</a>
      </div>
    </div>
  </nav>
</header>
