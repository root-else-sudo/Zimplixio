<div id="cookie-banner" class="hidden fixed bottom-0 inset-x-0 z-50 bg-white border-t border-gray-200 shadow-lg p-4 md:p-6 dark:bg-gray-800 dark:border-gray-700">
  <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
    <p class="text-gray-700 text-sm dark:text-gray-300">
      We use cookies to improve your experience on our site. By continuing to browse, you agree to our
      <a href="{% url 'pages:cookie_policy' %}" class="text-indigo-600 underline hover:text-indigo-800 dark:text-indigo-400 dark:hover:text-indigo-300">Cookie Policy</a>.
    </p>
    <div class="flex gap-3 shrink-0">
      <button id="cookie-accept" class="px-4 py-2 bg-indigo-600 text-white text-sm font-semibold rounded-lg hover:bg-indigo-700 transition-colors">
        Accept
      </button>
      <button id="cookie-dismiss" class="px-4 py-2 bg-gray-200 text-gray-700 text-sm font-semibold rounded-lg hover:bg-gray-300 transition-colors dark:bg-gray-700 dark:text-gray-300 dark:hover:bg-gray-600">
        Dismiss
      </button>
    </div>
  </div>
</div>
